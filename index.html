<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<title>Склад Сканер</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --surface2: #0f3460;
  --accent: #e94560;
  --green: #00c853;
  --red: #ff1744;
  --text: #eee;
  --text2: #aaa;
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; min-height: 100dvh;
  overflow-x: hidden; -webkit-tap-highlight-color: transparent;
}
.app { max-width: 600px; margin: 0 auto; padding: 12px; padding-bottom: 100px; }
.header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; margin-bottom: 8px; }
.header h1 { font-size: 20px; font-weight: 700; }
.header-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%; border: none;
  background: var(--surface); color: var(--text); font-size: 18px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.icon-btn:active { background: var(--surface2); }
.stats { display: flex; gap: 8px; margin-bottom: 12px; }
.stat-card { flex: 1; background: var(--surface); border-radius: var(--radius); padding: 10px; text-align: center; }
.stat-num { font-size: 24px; font-weight: 700; }
.stat-label { font-size: 11px; color: var(--text2); margin-top: 2px; }
.stat-card.scanned .stat-num { color: var(--green); }
.stat-card.remaining .stat-num { color: var(--accent); }
.upload-area {
  border: 2px dashed var(--surface2); border-radius: var(--radius);
  padding: 40px 20px; text-align: center; cursor: pointer;
  transition: border-color 0.3s, background 0.3s; margin-bottom: 12px;
}
.upload-area:active, .upload-area.dragover { border-color: var(--accent); background: rgba(233,69,96,0.1); }
.upload-icon { font-size: 48px; margin-bottom: 12px; }
.upload-text { color: var(--text2); font-size: 14px; }
.upload-text strong { color: var(--text); }
input[type="file"] { display: none; }
.scan-btn {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  width: calc(100% - 24px); max-width: 576px; padding: 16px; border: none;
  border-radius: var(--radius); background: var(--accent); color: white;
  font-size: 18px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  z-index: 100; box-shadow: 0 4px 20px rgba(233,69,96,0.4);
}
.scan-btn:active { transform: translateX(-50%) scale(0.97); }
.scan-btn:disabled { opacity: 0.5; }
.scan-btn svg { width: 24px; height: 24px; }

/* Scanner */
.scanner-overlay { position: fixed; inset: 0; background: #000; z-index: 1000; display: none; flex-direction: column; }
.scanner-overlay.active { display: flex; }
.scanner-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: rgba(0,0,0,0.8); z-index: 10;
}
.scanner-header h2 { font-size: 16px; color: white; }
.scanner-header-btns { display: flex; gap: 8px; }
.scanner-close {
  width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3);
  background: transparent; color: white; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.scanner-body { flex: 1; position: relative; overflow: hidden; background: #000; }
#quaggaContainer { width: 100%; height: 100%; }
#quaggaContainer video { width: 100% !important; height: 100% !important; object-fit: cover !important; position: absolute; top: 0; left: 0; }
#quaggaContainer canvas { display: none !important; }
#quaggaContainer canvas.drawingBuffer { display: none !important; }
.scan-frame {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 85%; height: 100px; border: 2px solid var(--accent); border-radius: 8px;
  pointer-events: none; box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
}
.scan-frame::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: var(--accent); animation: scanLine 2s ease-in-out infinite;
  box-shadow: 0 0 8px var(--accent);
}
@keyframes scanLine { 0%,100%{top:0} 50%{top:calc(100% - 2px)} }
.scanner-bottom {
  padding: 12px 16px; background: rgba(0,0,0,0.8); z-index: 10;
  display: flex; gap: 8px; align-items: center;
}
.scanner-bottom input {
  flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.1); color: white; font-size: 16px;
}
.scanner-bottom input::placeholder { color: rgba(255,255,255,0.4); }
.scanner-bottom button {
  padding: 10px 16px; border-radius: 8px; border: none;
  background: var(--accent); color: white; font-weight: 700; font-size: 14px; cursor: pointer;
  white-space: nowrap;
}
#photoInput { display: none; }
.debug-info {
  position: absolute; bottom: 80px; left: 12px; right: 12px;
  color: rgba(255,255,255,0.6); font-size: 11px; text-align: center;
  pointer-events: none; z-index: 5;
}

/* Result toast */
.result-toast {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 20px 16px; padding-bottom: max(20px, env(safe-area-inset-bottom));
  z-index: 1001; transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); text-align: center;
}
.result-toast.show { transform: translateY(0); }
.result-toast.success { background: linear-gradient(to top, rgba(0,200,83,0.95), rgba(0,200,83,0.85)); }
.result-toast.error { background: linear-gradient(to top, rgba(255,23,68,0.95), rgba(255,23,68,0.85)); }
.result-toast .result-number { font-size: 48px; font-weight: 800; }
.result-toast .result-name { font-size: 16px; font-weight: 600; margin-top: 4px; }
.result-toast .result-code { font-size: 12px; opacity: 0.8; margin-top: 4px; }
.result-toast .result-extra { font-size: 13px; opacity: 0.9; margin-top: 6px; font-style: italic; }

/* Table, search, tabs */
.table-info { background: var(--surface); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; }
.table-info .ti-name { font-weight: 600; font-size: 14px; }
.table-info .ti-meta { font-size: 12px; color: var(--text2); margin-top: 4px; }
.tab-bar { display: flex; gap: 4px; margin-bottom: 12px; background: var(--surface); border-radius: var(--radius); padding: 4px; }
.tab-btn { flex: 1; padding: 8px; border: none; border-radius: 8px; background: transparent; color: var(--text2); font-size: 13px; font-weight: 600; cursor: pointer; }
.tab-btn.active { background: var(--accent); color: white; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.search-bar {
  width: 100%; padding: 10px 14px; border-radius: var(--radius);
  border: 1px solid var(--surface2); background: var(--surface);
  color: var(--text); font-size: 14px; margin-bottom: 10px; outline: none;
}
.search-bar:focus { border-color: var(--accent); }
.table-wrap { border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.item-row { display: flex; align-items: center; padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); gap: 10px; }
.item-row.scanned { background: rgba(0,200,83,0.15); }
.item-row .item-num {
  width: 32px; height: 32px; border-radius: 50%; background: var(--surface2);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; flex-shrink: 0;
}
.item-row.scanned .item-num { background: var(--green); color: #000; }
.item-info { flex: 1; min-width: 0; }
.item-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-code { font-size: 11px; color: var(--text2); margin-top: 2px; }
.item-loc { font-size: 11px; color: var(--accent); }
.item-check { font-size: 20px; flex-shrink: 0; }
.history-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--surface); border-radius: 8px; margin-bottom: 4px; font-size: 13px; }
.history-item .hi-time { color: var(--text2); font-size: 11px; flex-shrink: 0; }
.history-item .hi-name { flex: 1; }
.history-item.hi-err { border-left: 3px solid var(--red); }
.history-item.hi-ok { border-left: 3px solid var(--green); }
.empty-state { text-align: center; padding: 30px; color: var(--text2); }
.empty-state .empty-icon { font-size: 40px; margin-bottom: 10px; }
.sync-status { font-size: 11px; color: var(--text2); text-align: center; margin-top: 8px; padding: 6px; }
.sync-status.syncing { color: #ffb300; }
.sync-status.synced { color: var(--green); }
.sync-status.error { color: var(--red); }

/* Settings */
.settings-panel { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 500; display: none; align-items: flex-end; justify-content: center; }
.settings-panel.active { display: flex; }
.settings-content {
  background: var(--surface); border-radius: var(--radius) var(--radius) 0 0;
  width: 100%; max-width: 600px; padding: 20px 16px;
  padding-bottom: max(20px, env(safe-area-inset-bottom));
  max-height: 80vh; overflow-y: auto;
}
.settings-content h3 { margin-bottom: 16px; }
.setting-group { margin-bottom: 16px; }
.setting-group label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; }
.setting-group input, .setting-group select {
  width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--surface2);
  background: var(--bg); color: var(--text); font-size: 14px;
}
.setting-group input:focus { border-color: var(--accent); outline: none; }
.settings-actions { display: flex; gap: 10px; margin-top: 16px; }
.btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn-primary { background: var(--accent); color: white; }
.btn-secondary { background: var(--surface2); color: var(--text); }
.btn-danger { background: var(--red); color: white; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <h1>📦 Склад Сканер</h1>
    <div class="header-actions">
      <button class="icon-btn" onclick="showSettings()">⚙️</button>
      <button class="icon-btn" onclick="exportHistory()">📤</button>
    </div>
  </div>

  <div id="uploadSection">
    <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">📋</div>
      <div class="upload-text"><strong>Загрузите Excel файл</strong><br>Лист отбора с артикулами OZON</div>
    </div>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
  </div>

  <div id="mainSection" style="display:none;">
    <div class="table-info"><div class="ti-name" id="tableName"></div><div class="ti-meta" id="tableMeta"></div></div>
    <div class="stats">
      <div class="stat-card"><div class="stat-num" id="totalCount">0</div><div class="stat-label">Всего</div></div>
      <div class="stat-card scanned"><div class="stat-num" id="scannedCount">0</div><div class="stat-label">Собрано</div></div>
      <div class="stat-card remaining"><div class="stat-num" id="remainingCount">0</div><div class="stat-label">Осталось</div></div>
    </div>
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="table" onclick="switchTab('table')">Таблица</button>
      <button class="tab-btn" data-tab="history" onclick="switchTab('history')">История</button>
    </div>
    <div class="tab-content active" id="tab-table">
      <input type="text" class="search-bar" id="searchBar" placeholder="🔍 Поиск по названию, коду или месту...">
      <div class="table-wrap" id="tableBody"></div>
    </div>
    <div class="tab-content" id="tab-history">
      <div id="historyList"><div class="empty-state"><div class="empty-icon">📭</div><div>Пока нет сканирований</div></div></div>
    </div>
    <div class="sync-status" id="syncStatus"></div>
    <div style="margin-top:16px;text-align:center;">
      <button class="btn btn-secondary" onclick="loadNewTable()" style="width:auto;padding:10px 20px;">📋 Загрузить другую таблицу</button>
    </div>
  </div>

  <button class="scan-btn" id="scanBtn" onclick="startScanner()" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4V1h3M20 1h3v3M1 20v3h3M20 23h3v-3"/><line x1="1" y1="12" x2="23" y2="12"/></svg>
    Сканировать
  </button>
</div>

<!-- Scanner -->
<div class="scanner-overlay" id="scannerOverlay">
  <div class="scanner-header">
    <h2 id="scannerTitle">Сканирование</h2>
    <div class="scanner-header-btns">
      <button class="scanner-close" onclick="stopScanner()">✕</button>
    </div>
  </div>
  <div class="scanner-body" id="scannerBody">
    <div id="quaggaContainer"></div>
    <div class="scan-frame"></div>
    <div class="debug-info" id="debugInfo"></div>
  </div>
  <div class="scanner-bottom">
    <input type="text" id="manualCode" placeholder="Или введите код вручную..." autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
    <button onclick="submitManualCode()">OK</button>
    <label class="scanner-close" style="border-style:solid;cursor:pointer;font-size:15px;" title="Сфотографировать">
      📷
      <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none;">
    </label>
  </div>
  <div class="result-toast" id="resultToast">
    <div class="result-number" id="resultNumber"></div>
    <div class="result-name" id="resultName"></div>
    <div class="result-code" id="resultCode"></div>
    <div class="result-extra" id="resultExtra"></div>
  </div>
</div>

<!-- Settings -->
<div class="settings-panel" id="settingsPanel" onclick="if(event.target===this)hideSettings()">
  <div class="settings-content">
    <h3>⚙️ Настройки</h3>
    <div class="setting-group"><label>Имя устройства</label><input type="text" id="deviceName" placeholder="Например: Телефон Петрова"></div>
    <div class="setting-group"><label>URL Google Apps Script</label><input type="url" id="gasUrl" placeholder="https://script.google.com/macros/s/..."></div>
    <div class="setting-group"><label>Вибрация</label><select id="vibrationEnabled"><option value="1">Включена</option><option value="0">Выключена</option></select></div>
    <div class="settings-actions">
      <button class="btn btn-secondary" onclick="hideSettings()">Закрыть</button>
      <button class="btn btn-primary" onclick="saveSettings()">Сохранить</button>
    </div>
    <div style="margin-top:16px;border-top:1px solid var(--surface2);padding-top:16px;">
      <button class="btn btn-danger" onclick="resetAll()" style="width:100%;">🗑 Сбросить все данные</button>
    </div>
  </div>
</div>

<script>
// ========== IndexedDB ==========
const DB_NAME = 'WarehouseScanner', DB_VER = 2;
let db = null;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('tables')) d.createObjectStore('tables', {keyPath:'id'});
      if (!d.objectStoreNames.contains('items')) { const s = d.createObjectStore('items', {keyPath:'id'}); s.createIndex('tableId','tableId'); s.createIndex('code','code'); }
      if (!d.objectStoreNames.contains('scans')) { const s = d.createObjectStore('scans', {keyPath:'id',autoIncrement:true}); s.createIndex('tableId','tableId'); }
      if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', {keyPath:'key'});
    };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => rej(r.error);
  });
}
function dbPut(s,d) { return new Promise((res,rej)=>{ const tx=db.transaction(s,'readwrite'); tx.objectStore(s).put(d); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
function dbGet(s,k) { return new Promise((res,rej)=>{ const tx=db.transaction(s,'readonly'); const r=tx.objectStore(s).get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbGetAll(s) { return new Promise((res,rej)=>{ const tx=db.transaction(s,'readonly'); const r=tx.objectStore(s).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbGetByIndex(s,i,v) { return new Promise((res,rej)=>{ const tx=db.transaction(s,'readonly'); const r=tx.objectStore(s).index(i).getAll(v); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbClear(s) { return new Promise((res,rej)=>{ const tx=db.transaction(s,'readwrite'); tx.objectStore(s).clear(); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }

// ========== Settings ==========
let settings = { deviceName:'', gasUrl:'', vibration:true };
async function loadSettings() {
  try {
    const dn=await dbGet('settings','deviceName'), gu=await dbGet('settings','gasUrl'), vb=await dbGet('settings','vibration');
    if(dn) settings.deviceName=dn.value; if(gu) settings.gasUrl=gu.value; if(vb!=null) settings.vibration=vb.value;
  } catch(e){}
  document.getElementById('deviceName').value=settings.deviceName;
  document.getElementById('gasUrl').value=settings.gasUrl;
  document.getElementById('vibrationEnabled').value=settings.vibration?'1':'0';
}
async function saveSettings() {
  settings.deviceName=document.getElementById('deviceName').value.trim();
  settings.gasUrl=document.getElementById('gasUrl').value.trim();
  settings.vibration=document.getElementById('vibrationEnabled').value==='1';
  await dbPut('settings',{key:'deviceName',value:settings.deviceName});
  await dbPut('settings',{key:'gasUrl',value:settings.gasUrl});
  await dbPut('settings',{key:'vibration',value:settings.vibration});
  hideSettings();
}
function showSettings(){ document.getElementById('settingsPanel').classList.add('active'); }
function hideSettings(){ document.getElementById('settingsPanel').classList.remove('active'); }

// ========== Sound ==========
let audioCtx = null;
function initAudio(){ if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }
function playTone(f,dur,type='sine',vol=0.3){ if(!audioCtx)return; try{ const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(vol,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur); o.start(); o.stop(audioCtx.currentTime+dur); }catch(e){} }
function playSuccess(){ playTone(880,.15,'sine',.4); setTimeout(()=>playTone(1108,.15,'sine',.4),100); setTimeout(()=>playTone(1320,.25,'sine',.4),200); }
function playError(){ playTone(300,.3,'square',.3); setTimeout(()=>playTone(200,.4,'square',.3),200); }
function playDuplicate(){ playTone(600,.1,'sine',.3); setTimeout(()=>playTone(600,.1,'sine',.3),200); }

// ========== State ==========
let currentTableId=null, items=[], scanHistory=[];
let lastScannedCode='', lastScanTime=0;

// ========== Excel Parsing ==========
function parseExcel(data, fileName) {
  const wb=XLSX.read(data,{type:'array'}), ws=wb.Sheets[wb.SheetNames[0]];
  const json=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  let headerRow=-1, colNum=-1, colOrder=-1, colCode=-1, colName=-1, colPlace=-1, colQty=-1;
  for(let i=0;i<Math.min(json.length,10);i++){
    const row=json[i].map(c=>String(c).toLowerCase());
    for(let j=0;j<row.length;j++){
      if(row[j].includes('артикул')||row[j].includes('код ozon')){headerRow=i;colCode=j;break;}
    }
    if(headerRow>=0)break;
  }
  if(headerRow<0){alert('Не найден столбец Артикул/Код OZON');return null;}
  const hdr=json[headerRow].map(c=>String(c).toLowerCase());
  for(let j=0;j<hdr.length;j++){
    if(hdr[j]==='№'||hdr[j]==='no')colNum=j;
    if(hdr[j].includes('номер заказа'))colOrder=j;
    if(hdr[j].includes('наименование'))colName=j;
    if(hdr[j].includes('место'))colPlace=j;
    if(hdr[j].includes('кол'))colQty=j;
  }
  if(colNum<0)colNum=0; if(colName<0)colName=colCode+1;
  const parsed=[];
  for(let i=headerRow+1;i<json.length;i++){
    const row=json[i];
    const code=String(row[colCode]||'').trim(), num=String(row[colNum]||'').trim();
    const name=String(row[colName]||'').trim();
    const place=colPlace>=0?String(row[colPlace]||'').trim():'';
    const qty=colQty>=0?String(row[colQty]||'').trim():'1';
    if(!code||code.toLowerCase().includes('итог')||!num||isNaN(parseInt(num)))continue;
    parsed.push({id:currentTableId+'_'+i, tableId:currentTableId, num:parseInt(num), code, name, place, qty, scanned:false});
  }
  return parsed.length?{fileName,items:parsed}:null;
}

// ========== Table Management ==========
async function loadTable(data,fileName){
  currentTableId='tbl_'+Date.now();
  const parsed=parseExcel(data,fileName);
  if(!parsed){alert('Не удалось распознать товары');return;}
  items=parsed.items; scanHistory=[];
  await dbPut('tables',{id:currentTableId,fileName,date:new Date().toISOString(),itemCount:items.length});
  await dbPut('settings',{key:'currentTableId',value:currentTableId});
  for(const item of items) await dbPut('items',item);
  showMainSection(fileName);
}
async function restoreState(){
  const tid=await dbGet('settings','currentTableId');
  if(!tid||!tid.value)return false;
  currentTableId=tid.value;
  const table=await dbGet('tables',currentTableId);
  if(!table)return false;
  items=await dbGetByIndex('items','tableId',currentTableId);
  items.sort((a,b)=>a.num-b.num);
  scanHistory=await dbGetByIndex('scans','tableId',currentTableId);
  scanHistory.sort((a,b)=>b.id-a.id);
  showMainSection(table.fileName);
  return true;
}
function showMainSection(fn){
  document.getElementById('uploadSection').style.display='none';
  document.getElementById('mainSection').style.display='block';
  document.getElementById('scanBtn').disabled=false;
  document.getElementById('tableName').textContent=fn;
  document.getElementById('tableMeta').textContent=items.length+' товаров · '+new Date().toLocaleDateString('ru');
  renderTable(); renderHistory(); updateStats();
}
function loadNewTable(){
  if(!confirm('Загрузить новую таблицу?'))return;
  document.getElementById('uploadSection').style.display='block';
  document.getElementById('mainSection').style.display='none';
  document.getElementById('scanBtn').disabled=true;
}

// ========== Rendering ==========
function renderTable(filter=''){
  const c=document.getElementById('tableBody'), f=filter.toLowerCase();
  const fl=items.filter(i=>!f||i.name.toLowerCase().includes(f)||i.code.toLowerCase().includes(f)||i.place.toLowerCase().includes(f)||String(i.num).includes(f));
  if(!fl.length){c.innerHTML='<div class="empty-state"><div class="empty-icon">🔍</div><div>Ничего не найдено</div></div>';return;}
  let h='';
  for(const i of fl){
    h+=`<div class="item-row ${i.scanned?'scanned':''}" id="row-${i.num}">
      <div class="item-num">${i.num}</div>
      <div class="item-info"><div class="item-name">${esc(i.name)}</div><div class="item-code">${esc(i.code)}</div>${i.place?`<div class="item-loc">📍 ${esc(i.place)}</div>`:''}</div>
      <div class="item-check">${i.scanned?'✅':'⬜'}</div></div>`;
  }
  c.innerHTML=h;
}
function renderHistory(){
  const c=document.getElementById('historyList');
  if(!scanHistory.length){c.innerHTML='<div class="empty-state"><div class="empty-icon">📭</div><div>Пока нет сканирований</div></div>';return;}
  let h='';
  for(const s of scanHistory){
    const t=new Date(s.time).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    h+=`<div class="history-item ${s.found?'hi-ok':'hi-err'}"><span class="hi-time">${t}</span><span class="hi-name">${s.found?`<b>#${s.itemNum}</b> ${esc(s.itemName)}`:`⛔ ${esc(s.code)} — нет в заявке`}</span></div>`;
  }
  c.innerHTML=h;
}
function updateStats(){
  const t=items.length, s=items.filter(i=>i.scanned).length;
  document.getElementById('totalCount').textContent=t;
  document.getElementById('scannedCount').textContent=s;
  document.getElementById('remainingCount').textContent=t-s;
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function switchTab(t){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));document.querySelectorAll('.tab-content').forEach(c=>c.classList.toggle('active',c.id==='tab-'+t));}

// ========== BARCODE SCANNER ==========
let isScanning = false;
let videoStream = null;
let scanAnimFrame = null;
let scannerMode = 'none'; // 'native' or 'quagga'

function hasNativeBarcodeDetector() {
  return typeof BarcodeDetector !== 'undefined';
}

async function startScanner() {
  initAudio();
  document.getElementById('scannerOverlay').classList.add('active');
  isScanning = true;
  document.getElementById('debugInfo').textContent = 'Запуск камеры...';

  // Strategy 1: Native BarcodeDetector (Android Chrome, modern browsers)
  if (hasNativeBarcodeDetector()) {
    try {
      await startNativeScanner();
      return;
    } catch(e) {
      console.warn('Native scanner failed, falling back to QuaggaJS:', e);
    }
  }

  // Strategy 2: QuaggaJS (iOS Safari, older browsers)
  try {
    await startQuaggaScanner();
  } catch(err) {
    console.error('Scanner error:', err);
    document.getElementById('debugInfo').textContent = 'Ошибка: ' + (err.message || err);
    alert('Ошибка камеры: ' + (err.message || err) +
      '\n\nПопробуйте:\n1. Разрешить доступ к камере\n2. Нажать 📷 для фото\n3. Ввести код вручную');
  }
}

// ---- Native BarcodeDetector (fast, accurate, works on Android) ----
async function startNativeScanner() {
  scannerMode = 'native';
  const container = document.getElementById('quaggaContainer');
  container.innerHTML = '<video id="nativeVideo" autoplay playsinline webkit-playsinline muted style="width:100%;height:100%;object-fit:cover;"></video>';
  const video = document.getElementById('nativeVideo');

  videoStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: {ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} },
    audio: false
  });
  video.srcObject = videoStream;
  await video.play();

  // Wait for frames
  await new Promise(r => { const c=()=>{if(video.videoWidth>0)r();else requestAnimationFrame(c);}; c(); });

  const detector = new BarcodeDetector({
    formats: ['code_128','ean_13','ean_8','code_39','code_93','itf','codabar']
  });

  document.getElementById('debugInfo').textContent =
    `Камера: ${video.videoWidth}x${video.videoHeight} | Наведите на штрих-код`;

  // Fast scan loop using native API
  async function scanFrame() {
    if (!isScanning || scannerMode !== 'native') return;
    try {
      const results = await detector.detect(video);
      for (const r of results) {
        if (r.rawValue) {
          const code = r.rawValue;
          const isOZN = /^OZN\d+$/.test(code);
          const inTable = items.some(i => i.code === code);
          if (isOZN || inTable) {
            await onScanSuccess(code);
          }
          break;
        }
      }
    } catch(e) {}
    scanAnimFrame = requestAnimationFrame(scanFrame);
  }
  scanAnimFrame = requestAnimationFrame(scanFrame);
}

// ---- QuaggaJS fallback (for iOS) ----
async function startQuaggaScanner() {
  scannerMode = 'quagga';
  const container = document.getElementById('quaggaContainer');
  container.innerHTML = '';

  await new Promise((resolve, reject) => {
    Quagga.init({
      inputStream: {
        name: 'Live', type: 'LiveStream', target: container,
        constraints: {
          facingMode: 'environment',
          width: { min: 640, ideal: 1280, max: 1920 },
          height: { min: 480, ideal: 720, max: 1080 },
          focusMode: 'continuous'
        },
        area: { top: '20%', right: '5%', left: '5%', bottom: '20%' }
      },
      locator: { patchSize: 'medium', halfSample: true },
      numOfWorkers: 0, frequency: 20,
      decoder: { readers: ['code_128_reader'], multiple: false },
      locate: true
    }, function(err) { if(err){reject(err);return;} resolve(); });
  });

  Quagga.start();

  const video = container.querySelector('video');
  if (video) {
    video.setAttribute('playsinline', 'true');
    const waitVideo = () => {
      if (video.videoWidth > 0)
        document.getElementById('debugInfo').textContent = `Камера: ${video.videoWidth}x${video.videoHeight} | Наведите на штрих-код`;
      else setTimeout(waitVideo, 200);
    };
    waitVideo();
  }

  Quagga.onDetected(async function(result) {
    if (!isScanning) return;
    if (!result || !result.codeResult || !result.codeResult.code) return;
    const code = result.codeResult.code;
    const isOZN = /^OZN\d+$/.test(code);
    const inTable = items.some(i => i.code === code);
    if (isOZN || inTable) await onScanSuccess(code);
  });

  } catch(err) {
    console.error('Scanner error:', err);
    document.getElementById('debugInfo').textContent = 'Ошибка: ' + (err.message || err);
    alert('Ошибка камеры: ' + (err.message || err) +
      '\n\nПопробуйте:\n1. Разрешить доступ к камере в настройках\n2. Нажать 📷 для фото\n3. Ввести код вручную');
  }
}

async function stopScanner() {
  isScanning = false;
  // Stop native scanner
  if (scanAnimFrame) { cancelAnimationFrame(scanAnimFrame); scanAnimFrame = null; }
  if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; }
  // Stop QuaggaJS
  try { Quagga.stop(); } catch(e) {}
  try { Quagga.offDetected(); } catch(e) {}
  document.getElementById('quaggaContainer').innerHTML = '';
  document.getElementById('scannerOverlay').classList.remove('active');
  scannerMode = 'none';
  hideResultToast();
}

// Manual code input
function submitManualCode() {
  const inp = document.getElementById('manualCode');
  const code = inp.value.trim();
  if (code) { onScanSuccess(code); inp.value = ''; }
}
document.getElementById('manualCode').addEventListener('keydown', e => { if(e.key==='Enter') submitManualCode(); });

// Photo capture fallback — decode a single image
document.getElementById('photoInput').addEventListener('change', async function(e) {
  const file = e.target.files[0];
  if (!file) return;
  this.value = '';
  document.getElementById('debugInfo').textContent = 'Распознаю фото...';

  const imgUrl = URL.createObjectURL(file);

  Quagga.decodeSingle({
    src: imgUrl,
    numOfWorkers: 0,
    inputStream: { size: 1920 },
    decoder: {
      readers: ['code_128_reader','ean_reader','ean_8_reader','code_39_reader']
    },
    locate: true,
    locator: { patchSize: 'large', halfSample: false }
  }, function(result) {
    URL.revokeObjectURL(imgUrl);
    if (result && result.codeResult && result.codeResult.code) {
      document.getElementById('debugInfo').textContent = 'Найден: ' + result.codeResult.code;
      onScanSuccess(result.codeResult.code);
    } else {
      document.getElementById('debugInfo').textContent = 'Не распознан. Попробуйте ещё.';
      alert('Штрих-код не распознан.\nСфотографируйте ближе или введите код вручную.');
    }
  });
});

// ========== Scan Result Handler ==========
async function onScanSuccess(code) {
  const now = Date.now();
  if (code === lastScannedCode && now - lastScanTime < 2000) return;
  lastScannedCode = code; lastScanTime = now;

  if (settings.vibration && navigator.vibrate) navigator.vibrate(100);

  const matched = items.filter(i => i.code === code);

  if (matched.length > 0) {
    const unscanned = matched.find(i => !i.scanned);
    const total = matched.length;
    const done = matched.filter(i => i.scanned).length;

    if (unscanned) {
      // Mark ONE item
      unscanned.scanned = true;
      await dbPut('items', unscanned);
      playSuccess();

      const newDone = done + 1;
      showResultToast(true, {
        number: '#' + unscanned.num,
        name: unscanned.name,
        code,
        extra: total > 1 ? `✓ Собрано ${newDone} из ${total}` : ''
      });

      const scan = { tableId:currentTableId, code, found:true, itemNum:String(unscanned.num), itemName:unscanned.name, time:new Date().toISOString(), device:settings.deviceName||getDeviceId() };
      await dbPut('scans', scan); scanHistory.unshift(scan); syncToSheets(scan);
    } else {
      // All already scanned
      playDuplicate();
      showResultToast(true, {
        number: '#' + matched[0].num,
        name: matched[0].name,
        code,
        extra: total > 1 ? `⚠️ Все ${total} уже собраны` : '⚠️ Уже отсканировано'
      });

      const scan = { tableId:currentTableId, code, found:true, itemNum:matched.map(i=>i.num).join(','), itemName:matched[0].name+' (повтор)', time:new Date().toISOString(), device:settings.deviceName||getDeviceId() };
      await dbPut('scans', scan); scanHistory.unshift(scan); syncToSheets(scan);
    }

    updateStats(); renderTable(document.getElementById('searchBar').value); renderHistory();
  } else {
    // Not found
    playError();
    if (settings.vibration && navigator.vibrate) navigator.vibrate([100,50,100]);
    showResultToast(false, { code });

    const scan = { tableId:currentTableId, code, found:false, itemNum:'', itemName:'', time:new Date().toISOString(), device:settings.deviceName||getDeviceId() };
    await dbPut('scans', scan); scanHistory.unshift(scan); syncToSheets(scan); renderHistory();
  }
}

function showResultToast(ok, data) {
  const t = document.getElementById('resultToast');
  t.className = 'result-toast show ' + (ok ? 'success' : 'error');
  document.getElementById('resultNumber').textContent = ok ? data.number : '⛔';
  document.getElementById('resultName').textContent = ok ? data.name : 'Товар отсутствует в заявке';
  document.getElementById('resultCode').textContent = data.code;
  document.getElementById('resultExtra').textContent = ok ? (data.extra || '') : '';
  clearTimeout(t._t); t._t = setTimeout(hideResultToast, 3000);
}
function hideResultToast() { document.getElementById('resultToast').classList.remove('show'); }

// ========== Google Sheets Sync ==========
let syncQueue=[], isSyncing=false;
async function syncToSheets(scan) {
  if(!settings.gasUrl)return;
  syncQueue.push(scan); if(isSyncing)return; isSyncing=true;
  const el=document.getElementById('syncStatus');
  el.textContent='🔄 Синхронизация...'; el.className='sync-status syncing';
  while(syncQueue.length>0){
    const batch=syncQueue.splice(0,syncQueue.length);
    try{
      const table=await dbGet('tables',currentTableId);
      await fetch(settings.gasUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({sheetName:table?table.fileName.replace(/\.[^.]+$/,''):currentTableId,scans:batch.map(s=>({time:s.time,code:s.code,found:s.found,itemNum:s.itemNum,itemName:s.itemName,device:s.device}))})
      });
      el.textContent='✅ Синхронизировано'; el.className='sync-status synced';
    }catch(e){el.textContent='❌ Ошибка синхронизации'; el.className='sync-status error'; syncQueue.unshift(...batch); break;}
  }
  isSyncing=false; setTimeout(()=>{el.textContent='';},5000);
}

// ========== Utils ==========
function getDeviceId(){ let id; try{id=localStorage.getItem('device_id')}catch(e){} if(!id){id='dev_'+Math.random().toString(36).substr(2,8); try{localStorage.setItem('device_id',id)}catch(e){}} return id; }

async function exportHistory(){
  if(!scanHistory.length){alert('Нет данных');return;}
  const rows=[['Время','Код','Найден','№ товара','Наименование','Устройство']];
  for(const s of scanHistory) rows.push([new Date(s.time).toLocaleString('ru'),s.code,s.found?'Да':'Нет',s.itemNum,s.itemName,s.device]);
  const wb=XLSX.utils.book_new(), ws=XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb,ws,'Сканирования');
  XLSX.writeFile(wb,'scan_history.xlsx');
}

async function resetAll(){
  if(!confirm('Удалить ВСЕ данные?'))return;
  if(!confirm('Точно уверены?'))return;
  await dbClear('tables'); await dbClear('items'); await dbClear('scans');
  currentTableId=null; items=[]; scanHistory=[];
  document.getElementById('uploadSection').style.display='block';
  document.getElementById('mainSection').style.display='none';
  document.getElementById('scanBtn').disabled=true;
  hideSettings();
}

// ========== Init ==========
document.getElementById('fileInput').addEventListener('change', function(e){
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>loadTable(new Uint8Array(ev.target.result),file.name);
  reader.readAsArrayBuffer(file);
});

const uploadArea=document.getElementById('uploadArea');
uploadArea.addEventListener('dragover',e=>{e.preventDefault();uploadArea.classList.add('dragover');});
uploadArea.addEventListener('dragleave',()=>uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop',e=>{e.preventDefault();uploadArea.classList.remove('dragover');const f=e.dataTransfer.files[0];if(f){const r=new FileReader();r.onload=ev=>loadTable(new Uint8Array(ev.target.result),f.name);r.readAsArrayBuffer(f);}});

document.getElementById('searchBar').addEventListener('input',function(){renderTable(this.value);});
document.addEventListener('touchstart',function f(){initAudio();document.removeEventListener('touchstart',f);},{once:true});

(async function(){
  await openDB(); await loadSettings();
  if(!await restoreState()){
    document.getElementById('uploadSection').style.display='block';
    document.getElementById('mainSection').style.display='none';
  }
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
